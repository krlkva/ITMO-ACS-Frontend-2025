<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - MyHome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">MyHome</a>
            <div class="d-flex gap-2">
                <span class="btn btn-outline-dark" id="userName"></span>
                <button class="btn btn-outline-dark" id="logoutBtn">Выйти</button>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row">
            <!-- Информация о пользователе -->
            <div class="col-lg-4 mb-4">
                <div class="bg-white rounded-4 p-4" id="userInfo">
                    <div class="text-center">
                        <div class="spinner-border text-dark mb-3" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Бронирования -->
            <div class="col-lg-8">
                <div class="bg-white rounded-4 p-4">
                    <h4 class="mb-4">Мои бронирования</h4>
                    <div id="bookingsList">
                        <div class="text-center py-4">
                            <div class="spinner-border text-dark" role="status">
                                <span class="visually-hidden">Загрузка...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script>
    // Проверка авторизации
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) {
        window.location.href = 'login.html';
    }

    // Отображение информации о пользователе
    function displayUserInfo() {
        document.getElementById('userName').textContent = `${user.firstName} ${user.lastName || ''}`;
        
        document.getElementById('userInfo').innerHTML = `
            <div class="text-center">
                <div class="bg-light rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" 
                     style="width: 100px; height: 100px;">
                    <span class="fs-1">${user.firstName[0]}${user.lastName ? user.lastName[0] : ''}</span>
                </div>
                <h4>${user.firstName} ${user.lastName || ''}</h4>
                <p class="text-muted">${user.email}</p>
                <p class="text-muted">${user.phone || 'Телефон не указан'}</p>
            </div>
        `;
    }

    // Загрузка бронирований
    async function loadBookings() {
        try {
            const bookings = await api.getUserBookings(user.id);
            
            const container = document.getElementById('bookingsList');
            
            if (bookings.length === 0) {
                container.innerHTML = '<p class="text-muted text-center py-4">У вас пока нет бронирований</p>';
                return;
            }
            
            // Получаем информацию об объектах для каждого бронирования
            const properties = await api.getProperties();
            
            container.innerHTML = bookings.map(booking => {
                const property = properties.find(p => p.id === booking.propertyId);
                return `
                    <div class="border-bottom pb-3 mb-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h5>${property ? property.title : 'Объект не найден'}</h5>
                                <p class="text-muted mb-1">Даты: ${booking.startDate || 'не указаны'}</p>
                                <p class="text-muted mb-1">Статус: <span class="badge bg-success">${booking.status || 'активно'}</span></p>
                            </div>
                            <button class="btn btn-sm btn-outline-danger" onclick="cancelBooking(${booking.id})">
                                Отменить
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            
        } catch (error) {
            document.getElementById('bookingsList').innerHTML = '<p class="text-danger">Ошибка загрузки бронирований</p>';
        }
    }

    // Отмена бронирования
    window.cancelBooking = async (bookingId) => {
        if (confirm('Отменить бронирование?')) {
            try {
                await api.cancelBooking(bookingId);
                loadBookings(); // перезагружаем список
                alert('Бронирование отменено');
            } catch (error) {
                alert('Ошибка при отмене');
            }
        }
    };

    // Выход
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('user');
        window.location.href = 'index.html';
    });

    // Загружаем данные
    displayUserInfo();
    loadBookings();
    </script>
</body>
</html>
