<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyHome - Объект</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">MyHome</a>
            <div class="d-flex gap-2">
                <a href="search.html" class="btn btn-outline-dark">Поиск</a>
                <a href="profile.html" class="btn btn-outline-dark">Профиль</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div id="propertyContent">
            <div class="text-center py-5">
                <div class="spinner-border text-dark" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script>
    async function loadProperty() {
        const urlParams = new URLSearchParams(window.location.search);
        const propertyId = urlParams.get('id');
        
        if (!propertyId) {
            window.location.href = 'search.html';
            return;
        }
        
        try {
            const property = await api.getProperty(parseInt(propertyId));
            
            if (!property) {
                document.getElementById('propertyContent').innerHTML = '<div class="text-center py-5">Объект не найден</div>';
                return;
            }
            
            displayProperty(property);
            
        } catch (error) {
            document.getElementById('propertyContent').innerHTML = '<div class="text-center py-5">Ошибка загрузки</div>';
        }
    }

    function displayProperty(property) {
        const user = JSON.parse(localStorage.getItem('user'));
        
        document.getElementById('propertyContent').innerHTML = `
            <div class="row">
                <div class="col-lg-8">
                    <img src="${property.image}" class="img-fluid rounded-4 mb-4" alt="${property.title}">
                    
                    <h1 class="h2 mb-3">${property.title}</h1>
                    
                    <div class="d-flex gap-4 text-muted mb-3">
                        <span>${property.address}</span>
                        <span>${property.area} м²</span>
                        ${property.floor ? `<span>${property.floor} этаж</span>` : ''}
                    </div>
                    
                    <div class="mb-4">
                        <span class="badge bg-light text-dark me-2 p-2">${getTypeName(property.type)}</span>
                    </div>
                    
                    <h3 class="h4 mb-3">Описание</h3>
                    <p class="text-muted mb-4">${property.description}</p>
                    
                    <h3 class="h4 mb-3">Удобства</h3>
                    <div class="row g-3 mb-4">
                        <div class="col-6 col-md-4">Wi-Fi</div>
                        <div class="col-6 col-md-4">Телевизор</div>
                        <div class="col-6 col-md-4">Кондиционер</div>
                        <div class="col-6 col-md-4">Кухня</div>
                        <div class="col-6 col-md-4">Стиральная машина</div>
                    </div>
                </div>
                
                <div class="col-lg-4">
                    <div class="bg-white rounded-4 p-4 sticky-top" style="top: 20px;">
                        <h2 class="h3 mb-4">${property.price.toLocaleString()} ₽ <span class="text-muted small fw-normal">/месяц</span></h2>
                        
                        ${user ? `
                            <div class="mb-4">
                                <label class="form-label">Дата заезда</label>
                                <input type="date" class="form-control mb-2" id="bookingDate">
                                <button class="btn btn-dark w-100 py-3 mt-3" id="bookBtn">
                                    Забронировать
                                </button>
                            </div>
                        ` : `
                            <div class="alert alert-info">
                                <a href="login.html" class="text-decoration-none">Войдите</a>, чтобы забронировать
                            </div>
                        `}
                        
                        <hr>
                        
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-light rounded-circle d-flex align-items-center justify-content-center" 
                                 style="width: 50px; height: 50px;">
                                <span class="fs-5">ВЛ</span>
                            </div>
                            <div>
                                <h6 class="mb-1">Владелец</h6>
                                <p class="text-muted small mb-0">На сайте с 2025</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        // Добавляем обработчик бронирования, если пользователь авторизован
        if (user) {
            document.getElementById('bookBtn')?.addEventListener('click', async () => {
                const date = document.getElementById('bookingDate').value;
                
                if (!date) {
                    alert('Выберите дату');
                    return;
                }
                
                try {
                    const bookingData = {
                        userId: user.id,
                        propertyId: property.id,
                        propertyTitle: property.title,
                        startDate: date,
                        status: 'активно'
                    };
                    
                    await api.createBooking(bookingData);
                    alert('Бронирование создано!');
                } catch (error) {
                    alert('Ошибка при бронировании');
                }
            });
        }
    }

    function getTypeName(type) {
        const types = {
            'apartment': 'Квартира',
            'house': 'Дом',
            'loft': 'Лофт'
        };
        return types[type] || type;
    }

    loadProperty();
    </script>
</body>
</html>
