<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - MyHome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">MyHome</a>
            <a href="index.html" class="btn btn-outline-dark">На главную</a>
        </div>
    </nav>

    <div class="container" style="max-width: 500px; margin-top: 50px;">
        <div class="bg-white rounded-4 p-4">
            <h2 class="text-center mb-4">Регистрация</h2>
            
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Имя</label>
                    <input type="text" class="form-control" id="firstName" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Фамилия</label>
                    <input type="text" class="form-control" id="lastName">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Телефон</label>
                    <input type="tel" class="form-control" id="phone">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" required minlength="6">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Подтвердите пароль</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                </div>
                
                <div id="errorMessage" class="alert alert-danger d-none"></div>
                
                <button type="submit" class="btn btn-dark w-100 py-2" id="submitBtn">
                    Зарегистрироваться
                </button>
                
                <p class="text-center mt-3">
                    Уже есть аккаунт? <a href="login.html">Войти</a>
                </p>
            </form>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const errorDiv = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        
        if (password !== confirm) {
            errorDiv.textContent = 'Пароли не совпадают';
            errorDiv.classList.remove('d-none');
            return;
        }
        
        try {
            errorDiv.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Регистрация...';
            
            const userData = {
                email: document.getElementById('email').value,
                password: password,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                phone: document.getElementById('phone').value
            };
            
            const newUser = await api.registerUser(userData);
            
            localStorage.setItem('user', JSON.stringify(newUser));
            window.location.href = 'profile.html';
            
        } catch (error) {
            errorDiv.textContent = error.message || 'Ошибка при регистрации';
            errorDiv.classList.remove('d-none');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Зарегистрироваться';
        }
    });
    </script>
</body>
</html>
