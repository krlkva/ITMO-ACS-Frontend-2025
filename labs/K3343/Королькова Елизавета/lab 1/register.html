<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyHome - Регистрация</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .auth-container {
            max-width: 500px;
            margin: 2rem auto;
        }
        .auth-card {
            background: white;
            border-radius: 30px;
            padding: 2.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body>

<!-- Навигация -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <i class="bi bi-house-heart"></i>MyHome
        </a>
        <a href="index.html" class="btn btn-outline-dark">
            <i class="bi bi-arrow-left"></i> На главную
        </a>
    </div>
</nav>

<!-- Форма регистрации -->
<main class="container">
    <div class="auth-container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <i class="bi bi-house-heart" style="font-size: 3rem;"></i>
                <h2 class="mt-3">Создать аккаунт</h2>
                <p class="text-muted">Присоединяйтесь к MyHome</p>
            </div>
            
            <form id="registerForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Имя</label>
                        <input type="text" class="form-control" id="name" placeholder="Анна" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Фамилия</label>
                        <input type="text" class="form-control" id="surname" placeholder="Иванова">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="123@45678.com" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Телефон</label>
                    <input type="tel" class="form-control" id="phone" placeholder="+7 (123) 456-78-90">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" placeholder="6 символов" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Подтвердите пароль</label>
                    <input type="password" class="form-control" id="confirm" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-dark w-100 py-3 mb-3">
                    Зарегистрироваться
                </button>
                
                <p class="text-center mb-0">
                    Уже есть аккаунт? 
                    <a href="login.html" class="text-decoration-none">Войти</a>
                </p>
            </form>
        </div>
    </div>
</main>

<!-- Скрипты -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
