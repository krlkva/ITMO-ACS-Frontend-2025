<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyHome - Вход</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .auth-container {
            max-width: 450px;
            margin: 3rem auto;
        }
        .auth-card {
            background: white;
            border-radius: 30px;
            padding: 2.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body>

<!-- Навигация -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <i class="bi bi-house-heart"></i>MyHome
        </a>
        <a href="index.html" class="btn btn-outline-dark">
            <i class="bi bi-arrow-left"></i> На главную
        </a>
    </div>
</nav>

<!-- Форма входа -->
<main class="container">
    <div class="auth-container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <i class="bi bi-house-heart" style="font-size: 3rem;"></i>
                <h2 class="mt-3">Добро пожаловать!</h2>
                <p class="text-muted">Войдите в свой аккаунт</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-4">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="123@45678.com" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-dark w-100 py-3 mb-3">
                    Войти
                </button>
                
                <p class="text-center mb-0">
                    Нет аккаунта? 
                    <a href="register.html" class="text-decoration-none">Зарегистрироваться</a>
                </p>
            </form>
        </div>
    </div>
</main>

<!-- Скрипты -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
